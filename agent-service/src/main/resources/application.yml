server:
  port: 8082

spring:
  application:
    name: incident-agent-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: incident-agent

incident:
  alerts-topic: incident-alerts

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY}

diagnostic-agent:
  max-iterations: 3
